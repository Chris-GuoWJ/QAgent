[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qagent-calibration"
version = "0.5.0"
description = "A QuantumX hardware calibration agent with recorded IQ and experiment reports"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "langchain-core>=1,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek>=1,<2", "httpx[socks]>=0.27,<1", "prompt-toolkit>=3,<4", "python-dotenv>=1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
qagent = "qagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
